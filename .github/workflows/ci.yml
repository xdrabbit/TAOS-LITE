# Regression fence: typecheck + lint + unit tests on every PR and push to
# main. Vercel only proves the app BUILDS — this proves the pinned behaviors
# (voice rule, predict model format, retry policy, prompt fences) still hold.
name: CI

# Markdown-only edits (e.g. jotting an idea into ENHANCEMENTS.md from a
# phone) skip CI — nothing they change is testable.
on:
  pull_request:
    paths-ignore: ["**.md"]
  push:
    branches: [main]
    paths-ignore: ["**.md"]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
